<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>kexin-store</title>
    <style>
        /* --- 网页基础设置 --- */
        body {
            margin: 0; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #fafafa; 
        }

        /* --- 导航栏 --- */
        .navbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 20px 50px;
            letter-spacing: 20px; 
            color: #000;
        }

        .nav-links {
            display: flex;
            list-style: none; 
            gap: 70px; 
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none; 
            color: #333;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase; 
        }

        .nav-links a:hover { color: #999; }

        .cart {
            font-size: 14px;
            cursor: pointer; 
        }

        /* --- 商品网格布局 --- */
        .product-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 50px; 
            max-width: 1200px; 
            margin: 0 auto; 
            justify-content: center;
        }

        /* --- 商品卡片 --- */
        .product-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s; 
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            background-color: #eeeeee;
            width: 100%;
            object-fit: contain;

            background-color: transparent;
            height: 250px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 16px;
            margin: 10px 0 5px;
            color: #333;
        }

        .product-price {
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- 购买按钮 --- */
        .buy-button {
            background-color: #1a1a1a;
            color: white;
            padding: 10px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            font-size: 14px;
            margin-top: auto; 
        }
        .buy-button:hover { background-color: #555; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration: none; color: black;">KEXIN</a></div>
        <ul class="nav-links">
            
<li><a href="croptops.html">Crop Tops</a></li>
          
<li><a href="denim.html">Denim</a></li>
          
<li><a href="oversize.html">Oversize</a></li>
          
  <li><a href="bags.html">Bags</a></li>
        </ul>
        <div class="cart">🛒 Cart (0)</div>
    </nav>

    <section class="product-grid">
        <div class="product-card">
            <img class="product-image" src="images/top1.webp" alt="Seed Casual Basic Short Sleeve Knit Ladies">
            <h3 class="product-title">Seed Casual Basic Short Sleeve Knit Ladies</h3>
            <p class="product-price">RM 29.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/top2.webp" alt="Garage Casual Short Sleeve Tee Ladies Graphic">
            <h3 class="product-title">Garage Casual Short Sleeve Tee Ladies Graphic</h3>
            <p class="product-price">RM 30.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/top3.webp" alt="Casual Short Sleeve Regular Tee Ladies">
            <h3 class="product-title">Casual Short Sleeve Regular Tee Ladies</h3>
            <p class="product-price">RM 20.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/top4.webp" alt="Seed Casual Basic Short Sleeve Regular Tee Ladies Fit Top ">
            <h3 class="product-title">Seed Casual Basic Short Sleeve Regular Tee Ladies Fit Top</h3>
            <p class="product-price">RM 20.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>
    </section>
    

    <script>
     let savedItems = localStorage.getItem('kexinCartItems');
let cartItems = [];
if (savedItems !== null) {
    cartItems = JSON.parse(savedItems); // 把保存的文字变回列表
}

// 2. 页面加载时，更新购物车数量显示
let cartElement = document.querySelector('.cart');
cartElement.innerText = "🛒 Cart (" + cartItems.length + ")"; // length 就是列表里有几件东西

// 3. 给所有的购买按钮添加监听器
let buyButtons = document.querySelectorAll('.buy-button');

buyButtons.forEach(function(button) {
    button.addEventListener('click', function() {
        
        // ✨ 新魔法：抓取商品信息 ✨
        // button.parentElement 指的是包住这个按钮的那个大方块 (.product-card)
        let card = button.parentElement; 
        
        // 从这个大方块里，找出图片地址、名字和价格
        let itemImg = card.querySelector('.product-image').src;
        let itemTitle = card.querySelector('.product-title').innerText;
        let itemPrice = card.querySelector('.product-price').innerText;

        // 把找出的信息打包成一个小包裹 (Object)，塞进我们的购物车列表里
        let newItem = {
            title: itemTitle,
            price: itemPrice,
            image: itemImg
        };
        cartItems.push(newItem);

        // 把更新后的列表保存到浏览器的记忆里 (必须转换成文字格式才能存)
        localStorage.setItem('kexinCartItems', JSON.stringify(cartItems));

        // 更新右上角的数字
        cartElement.innerText = "🛒 Cart (" + cartItems.length + ")";

        // 按钮变绿的视觉反馈
        let originalText = button.innerText; 
        button.innerText = "Added! ✓";      
        button.style.backgroundColor = "#4CAF50"; 

        setTimeout(function() {
            button.innerText = originalText;
            button.style.backgroundColor = "#1a1a1a";
        }, 1000);
    });
});
    </script>
</body>
</html>
