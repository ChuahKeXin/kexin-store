<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的时尚电商网站</title>
    <style>
        /* --- 网页基础设置 --- */
        body {
            margin: 0; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #fafafa; 
        }

        /* --- 导航栏 --- */
        .navbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 20px 50px;
            letter-spacing: 20px; 
            color: #000;
        }

        .nav-links {
            display: flex;
            list-style: none; 
            gap: 70px; 
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none; 
            color: #333;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase; 
        }

        .nav-links a:hover { color: #999; }

        .cart {
            font-size: 14px;
            cursor: pointer; 
        }

        /* --- 商品网格布局 --- */
        .product-grid {
            display: grid; 
            /* 修正了拼写错误：minmax */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 50px; 
            max-width: 1200px; 
            margin: 0 auto; 
            justify-content: center;
        }

        /* --- 商品卡片 --- */
        .product-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s; 
            /* 补回了按钮对齐的魔法 */
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            background-color: #eeeeee;
            width: 100%;
            object-fit: contain;

            background-color: transparent;
            height: 250px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 16px;
            margin: 10px 0 5px;
            color: #333;
        }

        .product-price {
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- 购买按钮 --- */
        .buy-button {
            background-color: #1a1a1a;
            color: white;
            padding: 10px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            font-size: 14px;
            /* 补回了把按钮推到最底部的魔法 */
            margin-top: auto; 
        }
        .buy-button:hover { background-color: #555; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">KEXIN</div>
        <ul class="nav-links">
            <li><a href="#">Crop Tops</a></li>
            <li><a href="#">Denim</a></li>
            <li><a href="#">Oversized</a></li>
            <li><a href="#">Bags</a></li>
        </ul>
        <div class="cart">🛒 Cart (0)</div>
    </nav>

    <section class="product-grid">
        <div class="product-card">
            <img class="product-image" src="images/bag.webp" alt="经典极简腋下包">
            <h3 class="product-title">经典极简腋下包</h3>
            <p class="product-price">RM 259.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/croptop.jpg" alt="基础款短版上衣">
            <h3 class="product-title">基础款短版上衣</h3>
            <p class="product-price">RM 59.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/denim.webp" alt="高腰直筒微喇牛仔裤">
            <h3 class="product-title">高腰直筒微喇牛仔裤</h3>
            <p class="product-price">RM 129.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/tshirt.webp" alt="落肩款宽松印花 T-Shirt">
            <h3 class="product-title">落肩款宽松印花 T-Shirt</h3>
            <p class="product-price">RM 79.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>
    </section>

    <script>
    </script>
</body>
</html>
