<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>kexin-store</title>
    <style>
        /* --- 网页基础设置 --- */
        body {
            margin: 0; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background-color: #fafafa; 
        }

        /* --- 导航栏 --- */
        .navbar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            padding: 20px 50px;
            letter-spacing: 20px; 
            color: #000;
        }

        .nav-links {
            display: flex;
            list-style: none; 
            gap: 70px; 
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none; 
            color: #333;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase; 
        }

        .nav-links a:hover { color: #999; }

        .cart {
            font-size: 14px;
            cursor: pointer; 
        }

        /* --- 商品网格布局 --- */
        .product-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 30px; 
            padding: 50px; 
            max-width: 1200px; 
            margin: 0 auto; 
            justify-content: center;
        }

        /* --- 商品卡片 --- */
        .product-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s; 
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-10px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            background-color: #eeeeee;
            width: 100%;
            object-fit: contain;

            background-color: transparent;
            height: 250px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 16px;
            margin: 10px 0 5px;
            color: #333;
        }

        .product-price {
            color: #666;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- 购买按钮 --- */
        .buy-button {
            background-color: #1a1a1a;
            color: white;
            padding: 10px 0;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            font-size: 14px;
            margin-top: auto; 
        }
        .buy-button:hover { background-color: #555; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html" style="text-decoration: none; color: black;">KEXIN</a></div>
        <ul class="nav-links">
            
<li><a href="croptops.html">Crop Tops</a></li>
          
<li><a href="denim.html">Denim</a></li>
          
<li><a href="oversize.html">Oversize</a></li>
          
  <li><a href="bags.html">Bags</a></li>
        </ul>
        <div class="cart">🛒 Cart (0)</div>
    </nav>

    <section class="product-grid">
        <div class="product-card">
            <img class="product-image" src="images/oversize1.webp" alt="Casual Active Oversized unisex Short Sleeve Tee">
            <h3 class="product-title">Casual Active Oversized unisex Short Sleeve Tee</h3>
            <p class="product-price">RM 79.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/oversize2.webp" alt="Casual Active Oversized unisex Short Sleeve Tee">
            <h3 class="product-title">Casual Active Oversized unisex Short Sleeve Tee</h3>
            <p class="product-price">RM 69.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/oversize3.webp" alt="Casual Active Oversized unisex Short Sleeve Tee">
            <h3 class="product-title">Casual Active Oversized unisex Short Sleeve Tee</h3>
            <p class="product-price">RM 79.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>

        <div class="product-card">
            <img class="product-image" src="images/oversize4.webp" alt="Casual Active Oversized unisex Short Sleeve Tee ">
            <h3 class="product-title">Casual Active Oversized unisex Short Sleeve Tee</h3>
            <p class="product-price">RM 69.00</p>
            <button class="buy-button">Add to Cart</button>
        </div>
    </section>
    

    <script>
        // 1. 读取记忆：检查浏览器是否记住了购物车的数量。如果没有，就从 0 开始。
let savedCount = localStorage.getItem('kexinCartCount');
let cartCount = 0;

if (savedCount !== null) {
    cartCount = parseInt(savedCount); // 把保存的文本重新转换成数字
}

// 2. 立即更新界面：当页面一加载，马上显示被记住的正确数字
let cartElement = document.querySelector('.cart');
cartElement.innerText = "🛒 Cart (" + cartCount + ")";

// 3. 监听点击事件
let buyButtons = document.querySelectorAll('.buy-button');

buyButtons.forEach(function(button) {
    button.addEventListener('click', function() {
        
        // 购物车数量 +1
        cartCount = cartCount + 1;

        // 更新屏幕上显示的文字
        cartElement.innerText = "🛒 Cart (" + cartCount + ")";

        // ✨ 魔法在这里：把最新的数字保存到浏览器的记忆里！ ✨
        localStorage.setItem('kexinCartCount', cartCount);

        // --- 视觉反馈 (让按钮变绿) ---
        let originalText = button.innerText; 
        button.innerText = "Added! ✓";      
        button.style.backgroundColor = "#4CAF50"; 

        setTimeout(function() {
            button.innerText = originalText;
            button.style.backgroundColor = "#1a1a1a";
        }, 1000);
    });
});
    </script>
</body>
</html>
